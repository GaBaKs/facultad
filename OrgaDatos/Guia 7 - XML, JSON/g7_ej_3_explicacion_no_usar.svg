<!-- Guia 7, Ejercicio 3 --> 
<!-- Declara Namespace para SVG -->
<svg  xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"> <!-- Declara Xlink namespace para poder usarlo -->
    <rect x="10" y="10" height="100" width="100" style="stroke:#ff0000; fill: #0000ff"/> <!-- Genera cuadrado de 100x100, colores hex -->
  <line x1="0"  y1="10" x2="0"  y2="100" style="stroke:#006600;"/> <!-- linea vertical -->
        <line x1="10" y1="10" x2="100" y2="100" style="stroke:#006600;"/> 
        <line x1="20" y1="10" x2="100" y2="50"  style="stroke:#006600;"/>
        <line x1="30" y1="10" x2="110" y2="10"  style="stroke:#006600;"/>
<!-- rectas dentro de cuadrado -->
<image x="20" y="20" width="300" height="80"
    xlink:href=""https://carrolodex.files.wordpress.com/2012/10/mclaren-p1-concept-car_front34.jpg" /> 
  <text x="20" y="40">Example SVG text 1</text> <!-- muestra texto -->
</svg>
